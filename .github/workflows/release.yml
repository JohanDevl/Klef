name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Two quick merges to main would otherwise race release-please into opening
# duplicate release PRs. Never cancel: an in-flight run may be uploading a DMG.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # Accumulates every Conventional Commit landed on main into an open
  # "chore(main): release X.Y.Z" PR. Merging that PR is the act of releasing:
  # it bumps version.txt, writes CHANGELOG.md, tags, and cuts the GitHub
  # release — which is what flips release_created to true on the next run.
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only runs on the push that merged the release PR. Attaches the built DMG to
  # the release release-please just created.
  dmg:
    name: Build & attach DMG
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15

    # The `secrets` context is not available in a step-level `if`, so presence
    # is hoisted into booleans here (job-level `env` *can* read secrets).
    env:
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.AC_NOTARY_KEY_P8 != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build (release)
        run: swift build -c release

      # Developer ID signing is opt-in: when the secrets are absent the scripts
      # fall back to ad-hoc and the release ships an unnotarized DMG. To upgrade,
      # add the four secrets below — no workflow change needed.
      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write notary key
        if: env.HAS_NOTARY_KEY == 'true'
        env:
          AC_NOTARY_KEY_P8: ${{ secrets.AC_NOTARY_KEY_P8 }}
        run: |
          echo "$AC_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "AC_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Bundle & package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_NOTARY_KEY_ID: ${{ secrets.AC_NOTARY_KEY_ID }}
          AC_NOTARY_ISSUER_ID: ${{ secrets.AC_NOTARY_ISSUER_ID }}
        run: |
          ./scripts/bundle-app.sh --force
          ./scripts/make-dmg.sh

      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/*.dmg dist/*.dmg.sha256 --clobber
